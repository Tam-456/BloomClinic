<!-- Map component: Authentic Vietnam line-art with animated stroke, islands sovereignty & TP.HCM pin -->
<div class="map-wrap" #mapWrap>
  <svg
    class="vietnam-map"
    viewBox="0 0 500 850"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Bản đồ Việt Nam với chủ quyền Hoàng Sa, Trường Sa và vị trí Bloom Beauty tại TP.HCM"
    role="img"
  >
    <defs>
      <!-- Gradient stroke for coastline and borders -->
      <linearGradient id="bloomMapGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F55588"/>
        <stop offset="50%" stop-color="#D63A6A"/>
        <stop offset="100%" stop-color="#8B1638"/>
      </linearGradient>

      <!-- Soft gradient fill for landmass -->
      <linearGradient id="bloomLandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFF0F4" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#FDE4EC" stop-opacity="0.4"/>
      </linearGradient>

      <!-- Glow filter for islands & markers -->
      <filter id="mapGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Pin drop shadow -->
      <filter id="pinDropShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8B1638" flood-opacity="0.35"/>
      </filter>
    </defs>
