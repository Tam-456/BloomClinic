<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" aria-label="Bloom Beauty & Wellness">
  <!-- Bloom icon: stylised flower petals -->
  <g transform="translate(4,4)">
    <!-- Center circle -->
    <circle cx="20" cy="20" r="5" fill="#D63A6A"/>
    <!-- Petals -->
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#F55588" opacity="0.85" transform="rotate(0,20,20)"/>
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#B5234B" opacity="0.75" transform="rotate(60,20,20)"/>
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#F55588" opacity="0.85" transform="rotate(120,20,20)"/>
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#B5234B" opacity="0.75" transform="rotate(180,20,20)"/>
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#F55588" opacity="0.85" transform="rotate(240,20,20)"/>
    <ellipse cx="20" cy="8" rx="4.5" ry="7" fill="#B5234B" opacity="0.75" transform="rotate(300,20,20)"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="30" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#8B1638">Bloom</text>
  <text x="108" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#D63A6A" letter-spacing="2">BEAUTY &amp; WELLNESS</text>
</svg>

